name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**", "fix/**", "chore/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Test + coverage (pytest)
        run: uv run pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=100

      - name: Check committed OpenAPI schema matches the code
        # Fails when an API change was made without running `make generate`
        run: |
          uv run python -m app.openapi > ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API client matches openapi.json
        # Fails when openapi.json was updated without re-running orval (`make generate`)
        run: |
          pnpm exec orval
          git diff --exit-code -- src/api/generated

      - name: Build (vite)
        # vite build generates routeTree.gen.ts (gitignored)
        run: pnpm exec vite build

      - name: Type check (tsc)
        run: pnpm exec tsc --noEmit

      - name: Lint (biome)
        run: pnpm exec biome check src/

      - name: Test (vitest)
        run: pnpm exec vitest run
