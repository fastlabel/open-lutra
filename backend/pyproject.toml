[project]
name = "open-lutra"
version = "0.1.0"
description = "ROS2 topic recorder for teleoperation robots (ROS2-standard topics)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FastLabel Inc." }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "watchfiles>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "mcap>=1.1.0",
    "mcap-ros2-support>=0.5.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0,<2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "types-PyYAML>=6.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (required by FastAPI Depends/Query etc.)
    "TC003",  # Move standard library import into type-checking block (too strict for runtime usage)
    "RUF001", # ambiguous unicode in string (false positives on Japanese)
    "RUF002", # ambiguous unicode in docstring (false positives on Japanese)
    "RUF003", # ambiguous unicode in comment (false positives on Japanese)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG"]  # Allow unused arguments in tests (pytest fixtures)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rclpy.*", "sensor_msgs.*", "std_msgs.*", "rosidl_runtime_py.*", "mcap.*", "mcap_ros2.*", "PIL.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = [
    "app/**/__init__.py",
    "app/infra/ros2/topic_node.py",        # rclpy Node (requires ROS2 runtime)
    "app/infra/ros2/thread.py",             # rclpy executor thread (requires ROS2 runtime)
    "app/features/config/memory_reader.py", # cgroup/proc filesystem (Docker only)
    "app/main.py",                          # App lifecycle glue (ROS2 + Docker)
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "\\.\\.\\.",  # Protocol abstract methods
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
