# Linux production override - enables network_mode: host for ROS2 DDS discovery
#
# With `docker compose -f ...`, an `environment` block in list form overrides the base,
# so use the map form to merge with the base.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    network_mode: host
    environment:
      DEBUG: "false"

  frontend:
    # node_modules ships inside the image, so drop the install the base file
    # runs at start and launch Vite directly — production needs no network.
    command: pnpm run dev
    extra_hosts:
      - "backend:host-gateway"  # Host resolution for reaching the backend container on the host network
